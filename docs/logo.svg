<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="개미 지수 GAEMI 50 PURE">
  <title>개미 지수 | GAEMI 50 PURE</title>
  <!-- Background Badge (WATCH Series Rounded Square) -->
  <rect width="64" height="64" rx="14" fill="#181816"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#34342f" stroke-width="1.5"/>

  <!-- Background Mini Chart Bars -->
  <rect x="10" y="44" width="5" height="9" rx="1.5" fill="#2e3846"/>
  <rect x="18" y="38" width="5" height="15" rx="1.5" fill="#2e3846"/>
  <rect x="26" y="31" width="5" height="22" rx="1.5" fill="#3b4d66"/>

  <!-- Stylized Ant Silhouette (Head, Thorax, Abdomen, 6 Legs, Antennae) -->
  <!-- Legs -->
  <path d="M29 33 L20 27 L15 30 M32 36 L22 37 L17 42 M35 39 L27 47 L23 53" fill="none" stroke="#eb6834" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 31 L43 24 L49 25 M38 35 L48 34 L53 38 M39 39 L47 45 L51 51" fill="none" stroke="#eb6834" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Abdomen (Gaster) -->
  <ellipse cx="24" cy="43" rx="8.5" ry="6.5" transform="rotate(-32 24 43)" fill="#eb6834"/>
  <path d="M19 44 Q24 39 28 43" fill="none" stroke="#181816" stroke-width="1.3" opacity="0.45"/>

  <!-- Node / Petiole & Thorax -->
  <circle cx="31.5" cy="36.5" r="2.2" fill="#d95926"/>
  <ellipse cx="36.5" cy="32" rx="5.5" ry="4.2" transform="rotate(-32 36.5 32)" fill="#f27441"/>

  <!-- Head -->
  <circle cx="43.5" cy="25.5" r="5" fill="#eb6834"/>
  <!-- Eye -->
  <circle cx="45.2" cy="24.2" r="1.3" fill="#ffffff"/>

  <!-- Antennae -->
  <path d="M45 21 L47 14 L53 12 M47.5 23.5 L53 19 L57 21" fill="none" stroke="#ff8b5e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rising Index Trend Line at Top Left -->
  <polyline points="10,25 18,19 24,22 34,12" fill="none" stroke="#3987e5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="34" cy="12" r="2.8" fill="#ffffff" stroke="#3987e5" stroke-width="2"/>
</svg>
