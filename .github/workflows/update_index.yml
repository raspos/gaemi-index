name: Update GAEMI INDEX Data

on:
  schedule:
    # 매주 평일 18:10 KST (09:10 UTC, KRX 정규장 투자자별 확정치 및 시간외 단일가 반영 완료 후)
    - cron: '10 9 * * 1-5'
    # 매주 평일 20:50 KST (11:50 UTC, 넥스트레이드 애프터마켓 마감 및 API 반영 지연 50분 경과 후)
    - cron: '50 11 * * 1-5'
    # 매주 일요일 03:30 KST (토요일 18:30 UTC, 주간 정기 전체 36개월 원자료 누락·기업이벤트·상장폐지 전수 검증)
    - cron: '30 18 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (daily: 일별 증분 업데이트 / full-audit: 과거 36개월 전수 검증 및 백필)'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - full-audit

permissions:
  contents: write

# PHASE 4 Section 2-3: 동시 실행 방지 (실행 중인 정상 작업을 강제 취소해 원장이 손상되지 않도록 cancel-in-progress: false 적용)
concurrency:
  group: gaemi-index-ledger-update
  cancel-in-progress: false

jobs:
  update-index-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository with persistent ledger shards
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine update mode (daily vs weekly full-audit)
        id: mode_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 18 * * 6" ]; then
            echo "mode=full-audit" >> $GITHUB_OUTPUT
          else
            echo "mode=daily" >> $GITHUB_OUTPUT
          fi

      - name: Step 1~6. Load persistent ledger, incremental fetch, merge & integrity check
        run: |
          python scripts/update_ledger.py --mode ${{ steps.mode_step.outputs.mode }}

      - name: Step 7~9. Calculate GAEMI 50 PURE, GAEMI 100, benchmarks, downside vulnerability
        run: |
          python scripts/build_phase2_analytics.py
          python scripts/audit_phase3_reliability.py
          python scripts/audit_phase4_deep.py
          python scripts/build_phase6_downside.py
          python scripts/build_phase7_expansion.py

      - name: Step 9-2. Assemble final web bundles (no duplicate backtest)
        run: |
          python scripts/build_phase2_analytics.py --bundle-only

      - name: Step 10~11. Verify pipeline integrity, JSON strict syntax, and version alignment
        run: |
          python scripts/verify_pipeline.py

      - name: Step 12. Commit and push verified ledger shards and web data to GitHub Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ledger_shards/*.parquet data/*.csv data/*.json data/*.parquet docs/data/*
          git diff --staged --quiet || git commit -m "chore(data): auto-update GAEMI 50 PURE ledger & index ($(date +'%Y-%m-%d %H:%M'))"
          git push
