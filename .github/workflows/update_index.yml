name: Update GAEMI INDEX Data

on:
  schedule:
    # 매주 평일 16:30 KST (07:30 UTC, KRX 정규장 마감 및 수급 확정 후)
    - cron: '30 7 * * 1-5'
    # 매주 평일 20:30 KST (11:30 UTC, 넥스트레이드 애프터마켓 마감 후)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data collection & GAEMI 50 PURE calculation
        run: |
          python scripts/collect_data.py
          python scripts/build_phase2_analytics.py
          python scripts/verify_pipeline.py

      - name: Commit and push updated index data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.csv data/*.json docs/data/*
          git diff --staged --quiet || git commit -m "chore(data): auto-update GAEMI 50 PURE data ($(date +'%Y-%m-%d'))"
          git push
